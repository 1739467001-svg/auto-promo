[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-promo"
version = "0.1.0"
description = "英语学习视频自动化分发工作流：文案 + 多比例封面 + 多平台浏览器自动发布"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69.0",
    "Pillow>=10.0.0",
    "imageio-ffmpeg>=0.5.1",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.45.0",
]

[project.scripts]
autopromo = "autopromo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
